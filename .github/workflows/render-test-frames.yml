name: Render test frames

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-scripts:
    name: Check scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Byte-compile scripts
        run: python -m py_compile scripts/*.py

      - name: Import-check scripts that do not need assets
        run: |
          set -euo pipefail
          # Several builders mkdir under the hard-coded asset root at import
          # time. That does not read plates, but the directory has to be writable.
          if [ ! -w /workspace ]; then
            sudo mkdir -p /workspace
            sudo chown "$(id -u):$(id -g)" /workspace
          fi
          python - << 'PY'
          import subprocess
          import sys
          from pathlib import Path

          # These import with numpy + opencv and do not open plates, clips, or mattes.
          # They may create empty directories under /workspace/lofi-v41-meow.
          safe = [
              "build_v41aa_ex",
              "build_v41ab_ex",
              "build_v41ac_ex",
              "build_v41ad_ex",
              "build_v41ae_ex",
              "build_v41af_ex",
              "build_v41ag_ex",
              "build_v41ah_ex",
              "build_v41b",
              "build_v41c",
              "build_v41e",
              "build_v41f",
              "build_v41f_r2",
              "build_v41g",
              "build_v41h",
              "build_v41i",
              "build_v41j",
              "build_v41j_r2",
              "build_v41p_ex",
              "build_v41q_ex",
              "build_v41r_ex",
              "build_v41s_ex",
              "build_v41t_ex",
              "build_v41u_ex",
              "build_v41v_ex",
              "build_v41w_ex",
              "build_v41x_ex",
              "build_v41y_ex",
              "build_v41z_ex",
              "proto_v41x_ex",
              "ci_render_frames",
          ]
          # Need local media, or packages that are not in requirements.txt.
          skipped = {
              "build_v41_mouth": "reads v30/v24 video and v31 mouth params at import",
              "build_v41_mouth_r1": "reads v30/v24 video and v31 mouth params at import",
              "build_v41_mouth_r2": "reads v30/v24 video and v31 mouth params at import",
              "build_v41_mouth_r3": "reads v30/v24 video and v31 mouth params at import",
              "build_v41d": "imports build_v41_mouth, which needs those assets",
              "build_v41k": "imports build_v41d, which needs those assets",
              "build_v41l": "imports build_v41d, which needs those assets",
              "make_before_after": "opens cycle json and test encodes at import",
              "make_whole_face_ba": "opens cycle json and test encodes at import",
              "mix_v41_audio": "reads PCM stems at import",
              "precompute_v41f_mattes": "needs Pillow and rembg, then a lossless span",
              "render_v41_span": "imports compositor from /workspace/lofi-v30-final and loads cycle npy",
              "verify_round": "decodes an encoded mp4 at import",
          }
          root = Path("scripts")
          missing = [name for name in safe if not (root / f"{name}.py").is_file()]
          if missing:
              sys.exit("missing scripts: " + ", ".join(missing))
          known = set(safe) | set(skipped)
          extra = sorted(p.stem for p in root.glob("*.py") if p.stem not in known)
          if extra:
              sys.exit("unclassified scripts (add to safe or skipped): " + ", ".join(extra))
          failed = []
          for name in safe:
              proc = subprocess.run(
                  [sys.executable, "-c", f"import sys; sys.path.insert(0, 'scripts'); import {name}"],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  tail = (proc.stderr or proc.stdout).strip().splitlines()
                  failed.append(f"{name}: {tail[-1] if tail else 'no output'}")
                  print(proc.stderr, file=sys.stderr)
              else:
                  print(f"imported {name}")
          print("skipped (need assets or extra packages):")
          for name, why in skipped.items():
              print(f"  {name}: {why}")
          if failed:
              sys.exit("import check failed:\n" + "\n".join(failed))
          PY

  render-test-frames:
    name: Render test frames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download assets-v1 release
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view assets-v1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Render test frames skipped."
            echo "Release assets-v1 is missing. Publish that tag with mimi-assets.part01.tar.gz, MANIFEST.txt, and SHA256SUMS before this job can render frames."
            echo "::notice title=Render test frames skipped::Release assets-v1 is missing. Source plates and generated clips must be published on tag assets-v1 before this job can render frames."
            exit 0
          fi
          mkdir -p "$HOME/mimi-release" "$HOME/mimi-extract"
          gh release download assets-v1 \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "$HOME/mimi-release"
          (cd "$HOME/mimi-release" && sha256sum -c SHA256SUMS)
          test -f "$HOME/mimi-release/mimi-assets.part01.tar.gz"
          tar -xzf "$HOME/mimi-release/mimi-assets.part01.tar.gz" -C "$HOME/mimi-extract"
          test -d "$HOME/mimi-extract/mimi-ci-pack"
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "MIMI_ROOT=$HOME/mimi-extract/mimi-ci-pack" >> "$GITHUB_ENV"

      - name: Render test frames
        if: steps.pack.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/frames
          python scripts/ci_render_frames.py \
            --root "$MIMI_ROOT" \
            --builders-dir builders \
            --frames 0,42,138,432 \
            --out artifacts/frames
          ls -l artifacts/frames

      - name: Upload test-frame PNGs
        if: steps.pack.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v41ag-ex-test-frames
          path: artifacts/frames/n*.png
          if-no-files-found: error
